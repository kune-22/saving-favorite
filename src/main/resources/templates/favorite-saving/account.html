<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>アカウント設定 | Saving Favorite</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-body">
<section th:fragment="content" data-screen="account" hidden>
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow">
                                ACCOUNT SETTINGS
                            </p>
                            <h1>
                                アカウント設定
                            </h1>
                            <p class="muted">
                                プロフィール画像と表示名を設定できます。
                            </p>
                        </div>
                    </div>
                    <section class="panel narrow-panel">
                        <form id="profile-form">
                            <label>
                                プロフィール画像を設定
                                <input class="image-upload-input" aria-label="プロフィール画像を上げる" name="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
                                <small class="muted">
                                    2MB以下の画像を選択してください。
                                </small>
                                <img class="image-preview" data-preview alt="プロフィール画像プレビュー" hidden>
                                <button type="button" class="quiet image-adjust-button" data-adjust-image hidden>画像を微調整</button>
                            </label>
                            <label>
                                表示名
                                <input name="name" required maxlength="50">
                            </label>
                            <label>
                                現在の所持金（円）
                                <input name="cash" type="number" min="0" max="999999999" step="0.01" placeholder="例：50000">
                                <small class="muted">金銭管理の残額計算に使用します。</small>
                            </label>
                            <input type="hidden" name="imageUrl">
                            <p class="form-error" role="alert">
                            </p>
                            <div class="form-actions">
                                <button type="submit">
                                    保存する
                                </button>
                                <button type="button" class="quiet" data-reset>
                                    入力をリセット
                                </button>
                            </div>
                        </form>
                    </section>
                </section>
</body>
</html>
