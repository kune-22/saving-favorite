<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>所持グッズ | Saving Favorite</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-body">
<section th:fragment="content" data-screen="inventory" hidden>
                    <div class="page-heading">
                        <div>
                            <p class="eyebrow">
                                MY COLLECTION
                            </p>
                            <h1>
                                所持グッズ
                            </h1>
                            <p class="muted">
                                登録したグッズをカテゴリごとに確認できます。
                            </p>
                        </div>
                        <button id="inventory-add" class="primary-link" type="button">
                            所持しているグッズを登録する
                        </button>
                    </div>
                    <div class="editor-grid">
                        <section id="inventory-editor" class="panel" hidden>
                            <h2 id="inventory-form-title">
                                グッズを登録
                            </h2>
                            <form id="inventory-form" data-item-form data-direct-image>
                                <input type="hidden" name="id">
                                <input type="hidden" name="status" value="OWNED">
                                <input type="hidden" name="recurrence" value="NONE">
                                <input type="hidden" name="deadline" value="">
                                <label>
                                    商品ページのURL（任意）
                                    <input name="storeUrl" type="url" maxlength="2048" placeholder="https://...">
                                    <button type="button" class="quiet metadata-fetch" data-fetch-metadata>URLから情報を自動入力</button>
                                    <button type="button" class="quiet metadata-fetch" data-fetch-metadata-list>一覧ページからグッズを選択</button>
                                    <p class="metadata-error" data-metadata-error role="alert"></p>
                                </label>
                                <label>
                                    推し
                                    <select name="favoriteId" data-favorite-select required>
                                    </select>
                                </label>
                                <label>
                                    グッズ名
                                    <input name="name" required maxlength="100" placeholder="お気に入りのグッズ">
                                </label>
                                <label>
                                    カテゴリ
                                    <input name="category" list="category-options" required maxlength="40" placeholder="アクリルスタンド、ぬいぐるみなど">
                                </label>
                                <label>
                                    グッズ画像
                                    <input class="image-upload-input" aria-label="グッズの画像を上げる" name="imageFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif">
                                    <small class="muted">
                                        画像を設定すると一覧で見分けやすくなります（2MB以下）。
                                    </small>
                                    <img class="image-preview" data-preview alt="グッズ画像プレビュー" hidden>
                                    <button type="button" class="quiet image-adjust-button" data-adjust-image hidden>画像を微調整</button>
                                </label>
                                <input type="hidden" name="imageUrl">
                                <div class="field-row">
                                    <label>
                                        購入単価（円）
                                        <input name="price" type="number" min="0" max="99999999" step="0.01" value="0" required>
                                    </label>
                                    <label>
                                        所持数
                                        <input name="quantity" type="number" min="1" max="9999" value="1" required>
                                    </label>
                                </div>
                                <label>
                                    購入日
                                    <input name="purchasedDate" type="date" required>
                                </label>
                                <p class="muted">
                                    ※ストアのトップページではなく、個別の商品ページURLを入力してください。金額は金銭管理にも反映されます。
                                </p>
                                <p class="muted scraping-note">
                                    ※公開ページのみ対応しています。JavaScriptで表示される商品情報も取得を試みますが、ログイン必須・CAPTCHA・Cloudflare等で保護されたページは取得できません。サイトの利用規約とアクセス制限に従ってください。
                                </p>
                                <p class="form-error" role="alert">
                                </p>
                                <div class="form-actions">
                                    <button type="submit">
                                        保存する
                                    </button>
                                    <button type="button" class="quiet" data-reset>
                                        入力をリセット
                                    </button>
                                </div>
                            </form>
                        </section>
                        <section class="panel">
                            <h2>
                                カテゴリ別のグッズ
                            </h2>
                            <label>
                                推しで絞り込む
                                <select id="inventory-filter" data-favorite-select data-optional>
                                </select>
                            </label>
                            <div id="inventory-list">
                            </div>
                        </section>
                    </div>
                </section>
</body>
</html>
