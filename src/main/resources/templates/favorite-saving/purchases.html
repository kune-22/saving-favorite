<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>購入／購入予定 | Saving Favorite</title>
    <link rel="stylesheet" th:href="@{/css/site.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="app-body">
<section th:fragment="content" data-screen="purchases" hidden>
                    <div class="page-heading"><h1>購入／購入予定</h1><a class="primary-link" href="/money" data-page="money">購入・予定を登録</a></div>
                    <section class="panel">
                        <div class="field-row">
                            <label>表示する状態<select id="purchase-status"><option value="">すべて</option><option value="PAID">購入済（サブスク等含）</option><option value="PLANNED">購入予定（サブスク等含）</option></select></label>
                            <label>日付の並び順<select id="purchase-order"><option value="desc">新しい順</option><option value="asc">古い順</option></select></label>
                        </div>
                        <p class="muted">購入日・購入予定日順に表示します。購入済みにすると所持グッズにも表示されます。</p>
                        <p id="purchase-count" aria-live="polite"></p>
                        <p id="purchase-error" role="alert"></p>
                        <div id="purchase-list"></div>
                    </section>
                </section>
</body>
</html>
