<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saving Favorite</title>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; }
        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            background-image: linear-gradient(172deg, #25bfd3 8%, #efaed1dd 50%, #9d82e8 92%);
            background-size: 250% 250%;
            animation: backgroundGradient 5s ease-in-out infinite alternate;
        }
        body::before,
        body::after {
            position: fixed;
            z-index: -1;
            width: 620px;
            height: 420px;
            border-radius: 45% 55% 60% 40%;
            content: "";
            filter: blur(28px);
            opacity: .45;
            pointer-events: none;
        }
        body::before {
            top: 8%;
            left: -180px;
            background: radial-gradient(ellipse, #ffffffaa 0%, #f1acd166 42%, transparent 72%);
            animation: waveLeft 4s ease-in-out infinite alternate;
        }
        body::after {
            right: -180px;
            bottom: 5%;
            background: radial-gradient(ellipse, #ffffff99 0%, #ad91e877 42%, transparent 72%);
            animation: waveRight 5s ease-in-out infinite alternate;
        }
        .gradation {
            background-image: linear-gradient(90deg, #25bfd3 8%, #efaed1dd 50%, #9d82e8 92%);
        }
        header { padding: 24px 8%; background: #73afdf; color: white; }
        header h1 { margin: 0; }
        main { position: relative; z-index: 1; display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; max-width: 980px; margin: 56px auto; padding: 0 24px; }
        .hero h2 { font-size: 42px; margin: 56px 0 16px; }
        .hero p { font-size: 18px; line-height: 1.8; }
        .card { background: white; border-radius: 16px; padding: 28px; box-shadow: 0 8px 28px #d9a8bd55; }
        label { display: block; margin-top: 16px; font-weight: 600; }
        input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 11px; border: 1px solid #d8c7d0; border-radius: 8px; font-size: 16px; }
        button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 8px; background: #d94f8a; color: white; font-size: 16px; font-weight: 700; cursor: pointer; }
        .message { padding: 12px; border-radius: 8px; background: #e8f7ed; color: #216b3a; }
        .error { padding: 12px; border-radius: 8px; background: #fff0f0; color: #a33a3a; }
        @media (max-width: 700px) { main { grid-template-columns: 1fr; margin: 24px auto; } .hero h2 { margin-top: 10px; font-size: 32px; } }
        @keyframes backgroundGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        @keyframes waveLeft {
            0% { transform: translate3d(0, 0, 0) rotate(-8deg) scale(1); }
            100% { transform: translate3d(360px, 130px, 0) rotate(18deg) scale(1.22); }
        }
        @keyframes waveRight {
            0% { transform: translate3d(0, 0, 0) rotate(8deg) scale(1.1); }
            100% { transform: translate3d(-380px, -120px, 0) rotate(-18deg) scale(.96); }
        }
        @media (prefers-reduced-motion: reduce) {
            body, body::before, body::after { animation: none; }
        }
    </style>
</head>
<body>
<header><h1>Saving Favorite</h1></header>
<main>
    <section class="hero">
        <h2>推し活を、<br>もっと楽しく。</h2>
        <p>推しの情報やグッズをまとめて管理できる、推し活のための金銭管理アプリです。</p>
        <p>アカウントを作成して、あなたの推し活を記録しましょう。</p>
    </section>
    <section class="card">
        <h2>新規登録</h2>
        <p th:if="${registered}" class="message">登録が完了しました。</p>
        <p th:if="${registrationError}" class="error" th:text="${registrationError}"></p>
        <form action="/register" method="post" th:object="${registrationForm}">
            <label for="name">ユーザー名</label>
            <input id="name" type="text" th:field="*{name}" required maxlength="50" autocomplete="name">
            <label for="email">メールアドレス</label>
            <input id="email" type="email" th:field="*{email}" required maxlength="255" autocomplete="email">
            <label for="password">パスワード</label>
            <input id="password" type="password" th:field="*{password}" required minlength="8" autocomplete="new-password">
            <label for="passwordConfirmation">パスワード（確認）</label>
            <input id="passwordConfirmation" type="password" th:field="*{passwordConfirmation}" required minlength="8" autocomplete="new-password">
            <button type="submit">アカウントを作成</button>
        </form>
        <label style="font-size: small;">※アイコンは後からの設定になります。</label>
    </section>
</main>
</body>
</html>
